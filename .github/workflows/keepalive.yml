name: Keep live instance awake

# Render's free tier spins the instance down after inactivity, which costs
# the first visitor ~60s of cold start. A scheduled ping reduces cold starts
# for the public app. GitHub may pause schedules after extended repo inactivity.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live app
        run: |
          curl --silent --show-error --max-time 90 --output /dev/null \
            https://plusone-ub3w.onrender.com/ || echo "Ping failed (instance may be redeploying)."
