name: Live service health check

# This is an infrastructure probe, not product traffic or an automatic demo.
# It checks both process liveness and database readiness. Scheduled requests may
# reduce cold starts, but they do not guarantee uptime or database durability.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live app
        run: |
          curl --fail --silent --show-error --max-time 90 --output /dev/null \
            https://plusone-ub3w.onrender.com/healthz/
      - name: Check database readiness
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            https://plusone-ub3w.onrender.com/readyz/
