name: CI

on:
  push:
    branches:
      - main
      - deepseek-api
      - plusone-production-ready
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ""
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: JavaScript syntax check
        run: node --check plusone/static/plusone/app.js

      - name: Django test suite
        run: python manage.py test --noinput

      - name: AI benchmark (deterministic pipeline)
        run: |
          python manage.py migrate --noinput
          python manage.py evaluate_ai --report eval-report.md
          cat eval-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AI benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: eval-report.md
